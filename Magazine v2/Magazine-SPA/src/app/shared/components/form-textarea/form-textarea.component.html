<mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-textarea">
  <mat-label>{{ label }}</mat-label>
  <textarea
    matInput
    [rows]="rows"
    [value]="value"
    [required]="required"
    [disabled]="disabled"
    (input)="changeValue($event)"
    (blur)="touch()"
  ></textarea>
</mat-form-field>
