<section class="management-page">
  <app-table-navigation-component
    title="Jednostki miary"
    backLink="/main/management"
    [showAddButton]="canManage"
    (searchSubmit)="search($event)"
    (add)="add()"
  />

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort aria-label="Tabela: Jednostki miary">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Symbol</th>
        <td mat-cell *matCellDef="let row">{{ row.symbol }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef justify="end"></th>
        <td mat-cell *matCellDef="let row" justify="end">
          <div class="actions">
            <button mat-button type="button" (click)="showDetails(row)">Szczegóły</button>
            @if (canManage) {
              <button mat-button type="button" (click)="edit(row)">Edytuj</button>
              <button mat-button type="button" (click)="remove(row)">Usuń</button>
            }
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row empty-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">Brak jednostek miary.</td>
      </tr>
    </table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[10, 25, 50]"
      [showFirstLastButtons]="true"
      aria-label="Wybierz stronę"
    />
  </div>
</section>
