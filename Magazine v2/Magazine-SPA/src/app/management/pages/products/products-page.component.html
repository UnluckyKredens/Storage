<section class="management-page">
  <app-table-navigation-component
    title="Produkty"
    backLink="/main/management"
    [searchValue]="searchValue"
    [showAddButton]="canManage"
    (searchSubmit)="search($event)"
    (add)="add()"
  />

  <div class="table-wrapper">
    <table
      mat-table
      [dataSource]="products()"
      matSort
      matSortActive="name"
      matSortDirection="asc"
      matSortDisableClear
      (matSortChange)="sortChanged($event)"
      aria-label="Tabela produktów"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nazwa</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>

      <ng-container matColumnDef="sku">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>SKU</th>
        <td mat-cell *matCellDef="let product">{{ product.sku }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Kategoria</th>
        <td mat-cell *matCellDef="let product">{{ product.category }}</td>
      </ng-container>

      <ng-container matColumnDef="unitOfMeasure">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Jednostka</th>
        <td mat-cell *matCellDef="let product">{{ product.unitOfMeasure }}</td>
      </ng-container>

      <ng-container matColumnDef="salePrice">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cena sprzedaży</th>
        <td mat-cell *matCellDef="let product">{{ product.salePrice | currency: 'PLN' }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Aktywny</th>
        <td mat-cell *matCellDef="let product">{{ product.isActive ? 'Tak' : 'Nie' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let product">
          <div class="actions">
            <button mat-button type="button" (click)="showDetails(product)">Szczegóły</button>
            @if (canManage) {
              <button mat-button type="button" (click)="edit(product)">Edytuj</button>
              <button mat-button type="button" (click)="remove(product)">Usuń</button>
            }
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row empty-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">Brak produktów.</td>
      </tr>
    </table>

    <mat-paginator
      [length]="total"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 25, 50]"
      [showFirstLastButtons]="true"
      aria-label="Wybierz stronę produktów"
      (page)="pageChanged($event)"
    />
  </div>
</section>
