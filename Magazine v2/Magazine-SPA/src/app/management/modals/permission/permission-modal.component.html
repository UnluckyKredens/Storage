<app-dialog-header [title]="title" />

@if (data.mode === 'details') {
  <mat-dialog-content>
    <dl>
      <dt>ID</dt>
      <dd>{{ display(data.row?.id) }}</dd>
      <dt>Kod</dt>
      <dd>{{ display(data.row?.code) }}</dd>
      <dt>Nazwa</dt>
      <dd>{{ display(data.row?.name) }}</dd>
      <dt>Opis</dt>
      <dd>{{ display(data.row?.description) }}</dd>
    </dl>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Zamknij</button>
  </mat-dialog-actions>
} @else if (data.mode === 'delete') {
  <mat-dialog-content>Czy na pewno chcesz usunąć uprawnienie?</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">Anuluj</button>
    <button mat-flat-button type="button" [mat-dialog-close]="true">Usuń</button>
  </mat-dialog-actions>
} @else {
  <form #modalForm="ngForm" (ngSubmit)="save()">
    <mat-dialog-content>
      <div class="fields">
        <app-form-input label="Kod" name="code" [(ngModel)]="form.code" required />
        <app-form-input label="Nazwa" name="name" [(ngModel)]="form.name" required />
        <app-form-textarea
          class="full-width"
          label="Opis"
          name="description"
          [(ngModel)]="form.description"
          [rows]="3"
        />
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" mat-dialog-close>Anuluj</button>
      <button mat-flat-button type="submit" [disabled]="modalForm.invalid || saving">
        {{ saving ? 'Zapisywanie...' : 'Zapisz' }}
      </button>
    </mat-dialog-actions>
  </form>
}
