<app-dialog-header [title]="title" />

@if (data.mode === 'details') {
  <mat-dialog-content>
    <dl>
      <dt>ID</dt>
      <dd>{{ display(data.row?.id) }}</dd>
      <dt>Nazwa</dt>
      <dd>{{ display(data.row?.name) }}</dd>
      <dt>Pełny dostęp</dt>
      <dd>{{ display(data.row?.hasAllPermissions) }}</dd>
      <dt>Uprawnienia</dt>
      <dd>{{ display(data.row?.permissionCodes) }}</dd>
    </dl>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Zamknij</button>
  </mat-dialog-actions>
} @else if (data.mode === 'delete') {
  <mat-dialog-content>Czy na pewno chcesz usunąć rolę?</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">Anuluj</button>
    <button mat-flat-button type="button" [mat-dialog-close]="true">Usuń</button>
  </mat-dialog-actions>
} @else {
  <form #modalForm="ngForm" (ngSubmit)="save()">
    <mat-dialog-content>
      <div class="fields">
        <app-form-input
          label="Nazwa"
          name="name"
          [(ngModel)]="form.name"
          [disabled]="nameDisabled"
          required
        />
        <app-form-select
          class="full-width"
          label="Uprawnienia"
          name="permissionCodes"
          [(ngModel)]="form.permissionCodes"
          [options]="permissions"
          [disabled]="permissionsDisabled"
          multiple
        />
      </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" mat-dialog-close>Anuluj</button>
      <button mat-flat-button type="submit" [disabled]="modalForm.invalid || saving">
        {{ saving ? 'Zapisywanie...' : 'Zapisz' }}
      </button>
    </mat-dialog-actions>
  </form>
}
