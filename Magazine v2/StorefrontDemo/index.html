<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magazine Store – części komputerowe</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="logo" href="./">magazine<span>store</span></a>
      <input id="search" type="search" placeholder="Czego szukasz?" aria-label="Szukaj">
      <button id="openTrack">Zamówienie</button>
      <button id="openCart">Koszyk <b id="cartCount">0</b></button>
    </div>
  </header>

  <main class="wrap">
    <h1>Części komputerowe</h1>
    <div id="products" class="grid"></div>
  </main>

  <footer class="wrap">Sklep demonstracyjny systemu magazynowego Magazine</footer>

  <dialog id="cart">
    <button class="close" aria-label="Zamknij">×</button>
    <h2>Koszyk</h2>
    <div id="cartLines"></div>
    <form id="checkout">
      <p class="total">Do zapłaty: <b id="cartTotal"></b></p>
      <input name="customerName" placeholder="Imię i nazwisko *" required>
      <input name="customerEmail" type="email" placeholder="E-mail *" required>
      <input name="customerPhone" type="tel" placeholder="Telefon">
      <input name="deliveryAddress" placeholder="Adres dostawy">
      <button class="buy">Zamawiam</button>
    </form>
  </dialog>

  <dialog id="tracking">
    <button class="close" aria-label="Zamknij">×</button>
    <h2>Status zamówienia</h2>
    <form id="trackForm">
      <input id="token" placeholder="Token zamówienia" required>
      <button class="buy">Sprawdź</button>
    </form>
    <div id="trackResult"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
