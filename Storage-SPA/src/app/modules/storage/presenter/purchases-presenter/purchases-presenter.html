<div class="container">
  <div class="container__options">
    <input matInput (keyup)="nil()" placeholder="Znajdź" #input>
    <button mat-flat-button (click)="nil()">Add</button>
  </div>
  <div class="container__table">
    <table mat-table [dataSource]="purchases" class="">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef> Item </th>
        <td mat-cell *matCellDef="let element"> {{element.item.name}} </td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> Qty. </th>
        <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
      </ng-container>

      <ng-container matColumnDef="cost">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let element"> {{element.cost | currency: 'PLN '}}</td>
      </ng-container>

            <ng-container matColumnDef="purchaseDate">
        <th mat-header-cell *matHeaderCellDef> Buy Date </th>
        <td mat-cell *matCellDef="let element"> {{element.purchaseDate | date: 'shortDate'}} </td>
      </ng-container>



      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef class="table__options"> Options </th>
        <td mat-cell *matCellDef="let element" class="table__options">
          <mat-icon (click)="nil()">edit</mat-icon>
          <mat-icon (click)="nil()">delete</mat-icon>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
