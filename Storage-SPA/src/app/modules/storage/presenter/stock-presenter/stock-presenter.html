<div class="container">
  <div class="container__options">
    <input matInput (keyup)="nil()" placeholder="Znajdź" #input>
    <button mat-flat-button (click)="nil()">Add</button>
  </div>
  <div class="container__table">
    <table mat-table [dataSource]="stock" class="">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.item.name}} </td>
      </ng-container>
            <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Category </th>
        <td mat-cell *matCellDef="let element"> {{element.item.category.name}} </td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> Quantity </th>
        <td mat-cell *matCellDef="let element"> {{element.quantity}} p.</td>
      </ng-container>



      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef class="table__options"> Options </th>
        <td mat-cell *matCellDef="let element" class="table__options">
          <mat-icon (click)="nil()">edit</mat-icon>
          <mat-icon (click)="nil()">delete</mat-icon>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
