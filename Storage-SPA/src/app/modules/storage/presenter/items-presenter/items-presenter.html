<div class="container">
  <div class="container__options">
    <input matInput (keyup)="find($event)" placeholder="Znajdź" #input>
    <button mat-flat-button (click)="addItem()">Add</button>
  </div>
  <div class="container__table">
    <table mat-table [dataSource]="items" class="">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="sku">
        <th mat-header-cell *matHeaderCellDef> Stock Keeping Unit </th>
        <td mat-cell *matCellDef="let element"> {{element.sku}} </td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Category </th>
        <td mat-cell *matCellDef="let element"> {{element.category.name}} </td>
      </ng-container>

      <ng-container matColumnDef="brutto">
        <th mat-header-cell *matHeaderCellDef> Brutto Price </th>
        <td mat-cell *matCellDef="let element"> {{element.bruttoPrice}} zł</td>
      </ng-container>
      <ng-container matColumnDef="netto">
        <th mat-header-cell *matHeaderCellDef> Netto Price </th>
        <td mat-cell *matCellDef="let element"> {{element.nettoPrice}} zł </td>
      </ng-container>

      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef class="table__options"> Options </th>
        <td mat-cell *matCellDef="let element" class="table__options">
          <mat-icon (click)="editItem(element)">edit</mat-icon>
          <mat-icon (click)="deleteItem(element)">delete</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
