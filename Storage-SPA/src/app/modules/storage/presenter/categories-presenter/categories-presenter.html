<div class="categories">
  <div class="options">
    <input matInput (keyup)="find($event)" placeholder="Znajdź" #input>
    <button mat-flat-button (click)="openAddCategory()">Add</button>
  </div>
  <div class="table">
    <table mat-table [dataSource]="categories" class="">
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef class="table__options"> Options </th>
        <td mat-cell *matCellDef="let element" class="table__options">
          <mat-icon (click)="editCategory(element)">edit</mat-icon>
          <mat-icon (click)="deleteCategory(element)">delete</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
