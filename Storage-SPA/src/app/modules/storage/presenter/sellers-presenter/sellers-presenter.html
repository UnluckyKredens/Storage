<div class="container">
  <div class="container__options">
    <input matInput (keyup)="nil()" placeholder="Znajdź" #input>
    <button mat-flat-button (click)="nil()">Add</button>
  </div>
  <div class="container__table">
    <table mat-table [dataSource]="sellers" class="">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="nip">
        <th mat-header-cell *matHeaderCellDef> NIP </th>
        <td mat-cell *matCellDef="let element"> {{element.nip}} </td>
      </ng-container>

      <ng-container matColumnDef="adress">
        <th mat-header-cell *matHeaderCellDef> Adress </th>
        <td mat-cell *matCellDef="let element"> {{element.adress}} </td>
        <!-- @if() -->
      </ng-container>


      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef class="table__options"> Options </th>
        <td mat-cell *matCellDef="let element" class="table__options">
          <mat-icon (click)="nil()">edit</mat-icon>
          <mat-icon (click)="nil()">delete</mat-icon>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
