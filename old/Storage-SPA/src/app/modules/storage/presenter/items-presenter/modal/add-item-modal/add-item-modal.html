<form class="add" [formGroup]="itemForm">
  <mat-form-field appearance="fill" class="add__field">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>
  <mat-form-field appearance="fill" class="add__field">
    <mat-label>SKU</mat-label>
    <input matInput formControlName="sku">
  </mat-form-field>
  <mat-form-field placeholder="Category" appearance="fill" class="add__field">
    <mat-label>Category</mat-label>
  <mat-select name="Category" formControlName="category">
    @for(category of categories; track category.id) {
      <mat-option [value]="category">{{category.name}}</mat-option>
    }
  </mat-select>
  </mat-form-field>
  <mat-form-field appearance="fill" class="add__field">
    <mat-label>Brutto Price (PLN)</mat-label>
    <input matInput type="number" step="0.01" formControlName="bruttoPrice">
  </mat-form-field>
  <mat-form-field appearance="fill" class="add__field">
    <mat-label>Netto Price (PLN)</mat-label>
    <input matInput type="number" step="0.01" formControlName="nettoPrice">
    @if(itemForm.value.bruttoPrice) {
      <mat-hint (click)="setNetto()" style="color: red">
        23%: {{ (itemForm.value.bruttoPrice / 1.23) | number:'1.2-2'
      }} PLN</mat-hint>
    }
  </mat-form-field>
  <div class="add__actions">
    @if(editedItem == undefined) {
    <button mat-flat-button color="primary" (click)="addItem()">Add Item</button>
    } @else {
    <button mat-flat-button color="primary" (click)="updateItem()">Update Item</button>
    }
  </div>
</form>
